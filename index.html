<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sound on Paper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stage">
  <div id="paperWrap">
    <canvas id="paperTexture"></canvas>
    <canvas id="ink"></canvas>

    <div id="hud">
      <div class="title">sound, on paper</div>
      <div id="note-readout">&nbsp;</div>
    </div>

    <div id="startOverlay">
      <h1>play something</h1>
      <p>Give it your microphone and play a few notes on your guitar. Each note leaves a wash of ink on the page. It listens for tonal, sustained pitches, so speech and taps are mostly filtered out.</p>
      <button id="beginBtn">let it listen</button>
    </div>

    <div id="status">
      <span id="statusText">not listening</span>
      <div id="meter"><div id="meterFill"></div></div>
    </div>

    <div id="controls">
      <button id="clearBtn" class="ghost">clear the page</button>
      <button id="endBtn" class="ghost hidden">end session</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
