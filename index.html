<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guitar Paint</title>
<link rel="stylesheet" href="style.css?v=20261024d">
</head>
<body>

<div id="stage">
  <div id="paperWrap">
    <canvas id="view"></canvas>
    <canvas id="gl"></canvas>

    <div id="hud">
      <div>
        <div class="title">guitar paint</div>
        <div id="hearLog" class="hidden" aria-live="polite"></div>
      </div>
      <div id="note-readout" class="hidden">&nbsp;</div>
    </div>

    <div id="startOverlay">
      <h1>play something</h1>
      <p>Give it your microphone and play your guitar. Every note or chord drops a wash of watercolour onto the page, and each pitch has its own pigment. Speech and taps are mostly ignored.</p>
      <button id="beginBtn">let it listen</button>
      <p id="startError" role="alert"></p>
    </div>

    <div id="status">
      <span id="statusText">not listening</span>
      <div id="meter" title="sounds need to pass the line to paint"><div id="meterFill"></div><div id="meterGate"></div></div>
    </div>

    <div id="settingsPanel" class="hidden" role="dialog" aria-label="settings">
      <label class="row switch-row">
        <span>show note &amp; chord names</span>
        <input type="checkbox" id="optNames">
        <span class="switch" aria-hidden="true"></span>
      </label>
      <label class="row switch-row">
        <span>show what it hears</span>
        <input type="checkbox" id="optHearing">
        <span class="switch" aria-hidden="true"></span>
      </label>
      <label class="row">
        <span>sensitivity</span>
        <input type="range" id="optSens" min="0" max="1" step="0.01">
      </label>
      <div class="group">
        <div class="group-label">pigments</div>
        <div id="paletteList" class="palette-list" role="radiogroup" aria-label="pigments"></div>
      </div>
      <div class="group">
        <div class="group-label">paper <em id="paperName"></em></div>
        <div id="paperList" class="paper-list" role="radiogroup" aria-label="paper"></div>
      </div>
      <label class="row switch-row">
        <span>blots fade away</span>
        <input type="checkbox" id="optFade">
        <span class="switch" aria-hidden="true"></span>
      </label>
      <label class="row" id="lingerRow">
        <span>stay on the page <em id="lingerVal"></em></span>
        <input type="range" id="optLinger" min="0" max="1" step="0.01">
      </label>
      <label class="row" id="fadeSpeedRow">
        <span>fade speed <em id="fadeSpeedVal"></em></span>
        <input type="range" id="optFadeSpeed" min="0" max="1" step="0.01" aria-label="fade speed, slow to fast">
      </label>
      <label class="row">
        <span>blot size</span>
        <input type="range" id="optSize" min="0" max="1" step="0.01">
      </label>
      <button id="resetBtn" class="reset">reset to defaults</button>
    </div>

    <div id="controls">
      <button id="clearBtn" class="ghost">clear the page</button>
      <button id="settingsBtn" class="ghost" aria-expanded="false" aria-controls="settingsPanel">settings</button>
      <button id="endBtn" class="ghost hidden">end session</button>
    </div>
  </div>
</div>

<script src="ink-fluid.js?v=20261024d"></script>
<script src="app.js?v=20261024d"></script>
</body>
</html>
